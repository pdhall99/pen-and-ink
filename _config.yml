title: Pen and ink resources 🖋️
description: >-
  Resources for pen and ink drawing.
# baseurl: "" # the subpath of your site, e.g. /blog
url: "https://pdhall99.github.io/pen-and-ink"

# Build settings
plugins:
  - jekyll-feed
  - jekyll-redirect-from

whitelist:
  - jekyll-redirect-from

markdown: kramdown

compress_html:
  clippings: all
  comments: [""]
  endings: [html, head, body, li, dt, dd, rt, rp, optgroup, option, colgroup, caption, thead, tbody, tfoot, tr, td, th]
  profile: false
  blanklines: false
  ignore:
    envs: []

collections:
  my_tags:
    output: true
    permalink: /tagged/:slug/
defaults:
  -
    scope:
      path: ""
      type: my_tags
    values:
      layout: tagged

# baseurl: ""
permalink: /blog/:slug
timezone: Europe/London
future: false

exclude:
- README.md
- LICENSE

exclude: [vendor]

Blog: /blog
