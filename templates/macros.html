{%- component bear.table_of_contents(toc, max_level) %}
<ul>
  {%- for header in toc %}
    <li>
      <a href="{{ header.permalink | safe }}">{{ header.title }}</a>
      {%- if header.children and header.level < max_level %}
        {{<bear.table_of_contents toc={header.children} max_level={max_level} />}}
      {%- endif %}
    </li>
  {%- endfor %}
</ul>
{%- endcomponent bear.table_of_contents %}
